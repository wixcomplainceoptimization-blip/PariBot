<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PariBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 400px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 2px solid var(--tg-theme-secondary-bg-color, #e0e0e0);
            margin-bottom: 20px;
        }
        .title { font-size: 22px; font-weight: bold; }
        .balance {
            font-size: 20px;
            font-weight: bold;
            color: var(--tg-theme-accent-color, #0088cc);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            text-align: center;
        }
        .stat-item { display: flex; flex-direction: column; }
        .stat-label { font-size: 10px; text-transform: uppercase; opacity: 0.7; }
        .stat-value { font-size: 16px; font-weight: bold; margin-top: 4px; }
        .stat-value.win { color: #00c853; }
        .stat-value.lose { color: #ff1744; }
        .game-area {
            text-align: center;
            padding: 20px 0;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .result-box { font-size: 56px; min-height: 80px; margin: 10px 0; }
        .result-message { font-size: 18px; font-weight: bold; min-height: 30px; margin-bottom: 10px; }
        .result-message.win { color: #00c853; }
        .result-message.lose { color: #ff1744; }
        .bet-control { margin: 10px 0; }
        .bet-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        .bet-input {
            width: 120px;
            padding: 12px;
            font-size: 18px;
            border: 2px solid var(--tg-theme-secondary-bg-color, #e0e0e0);
            border-radius: 8px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            text-align: center;
        }
        .btn {
            padding: 16px 40px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--tg-theme-button-color, #0088cc); }
        .btn-primary:active { transform: scale(0.95); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-small {
            padding: 12px 16px;
            font-size: 14px;
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            color: var(--tg-theme-text-color, #000000);
        }
        .history {
            padding: 12px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
        }
        .history-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 14px;
        }
        .history-item:last-child { border-bottom: none; }
        .history-result.win { color: #00c853; font-weight: bold; }
        .history-result.lose { color: #ff1744; font-weight: bold; }
        .history-empty { text-align: center; color: #999; padding: 20px 0; }
        .error { color: #ff1744; text-align: center; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="title">🎲 PariBot</span>
            <span class="balance">💰 <span id="balance">0</span></span>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Games</span>
                <span class="stat-value" id="gamesPlayed">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total Won</span>
                <span class="stat-value win" id="totalWon">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total Lost</span>
                <span class="stat-value lose" id="totalLost">0</span>
            </div>
        </div>
        
        <div class="game-area">
            <div class="result-box" id="resultBox">🎯</div>
            <div class="result-message" id="resultMessage">Place your bet & spin!</div>
            
            <div class="bet-control">
                <div class="bet-input-group">
                    <button class="btn btn-small" onclick="adjustBet(-5)">-5</button>
                    <input type="number" class="bet-input" id="betAmount" value="10" min="1" step="1">
                    <button class="btn btn-small" onclick="adjustBet(5)">+5</button>
                </div>
            </div>
            
            <button class="btn btn-primary" id="spinBtn" onclick="spin()">🎰 Spin</button>
        </div>
        
        <div class="history">
            <div class="history-title">📊 Recent Games</div>
            <div id="historyList">
                <div class="history-empty">No games played yet</div>
            </div>
        </div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        let balance = 0;
        let isSpinning = false;
        const API_URL = window.location.origin;
        
        async function init() {
            try {
                const response = await fetch(`${API_URL}/api/user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                if (!response.ok) throw new Error('Auth failed');
                const data = await response.json();
                updateUI(data.user);
                loadHistory();
            } catch (error) {
                console.error('Init error:', error);
                document.getElementById('resultMessage').textContent = '❌ Connection failed';
            }
        }
        
        function updateUI(data) {
            balance = data.balance;
            document.getElementById('balance').textContent = balance.toFixed(1);
            document.getElementById('gamesPlayed').textContent = data.games_played || 0;
            document.getElementById('totalWon').textContent = data.total_won ? data.total_won.toFixed(1) : '0.0';
            document.getElementById('totalLost').textContent = data.total_lost ? data.total_lost.toFixed(1) : '0.0';
        }
        
        function adjustBet(amount) {
            const input = document.getElementById('betAmount');
            let val = parseFloat(input.value) || 0;
            val = Math.max(1, val + amount);
            input.value = val;
        }
        
        async function spin() {
            if (isSpinning) return;
            
            const bet = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(bet) || bet < 1) {
                setResult('❌', 'Invalid bet');
                return;
            }
            if (bet > balance) {
                setResult('❌', 'Insufficient balance!');
                return;
            }
            
            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.textContent = '🔄 Spinning...';
            setResult('⏳', 'Spinning...');
            
            try {
                const response = await fetch(`${API_URL}/api/spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        initData: tg.initData,
                        bet: bet
                    })
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Spin failed');
                }
                
                const data = await response.json();
                updateUI(data);
                
                if (data.win) {
                    setResult('🎉', `WIN +${data.win_amount.toFixed(1)}!`);
                    document.getElementById('resultBox').className = 'result-box win';
                } else {
                    setResult('😢', `LOSE -${bet.toFixed(1)}`);
                    document.getElementById('resultBox').className = 'result-box';
                }
                
                loadHistory();
            } catch (error) {
                setResult('❌', error.message);
            } finally {
                isSpinning = false;
                btn.disabled = false;
                btn.textContent = '🎰 Spin';
            }
        }
        
        function setResult(emoji, message) {
            document.getElementById('resultBox').textContent = emoji;
            const msg = document.getElementById('resultMessage');
            msg.textContent = message;
            msg.className = 'result-message';
        }
        
        async function loadHistory() {
            try {
                const response = await fetch(`${API_URL}/api/history`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                if (!response.ok) throw new Error('History failed');
                const data = await response.json();
                
                const list = document.getElementById('historyList');
                if (!data.history || data.history.length === 0) {
                    list.innerHTML = '<div class="history-empty">No games played yet</div>';
                    return;
                }
                
                list.innerHTML = data.history.map(h => `
                    <div class="history-item">
                        <span>Bet $${h.bet.toFixed(1)}</span>
                        <span class="history-result ${h.result}">
                            ${h.result === 'win' ? '+' : '-'}$${Math.abs(h.win - h.bet).toFixed(1)}
                        </span>
                    </div>
                `).join('');
            } catch (error) {
                console.error('History error:', error);
            }
        }
        
        // Enter key to spin
        document.getElementById('betAmount').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') spin();
        });
        
        // Start
        init();
    </script>
</body>
</html>
